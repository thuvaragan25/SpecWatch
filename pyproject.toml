[project]
name = "specwatch"
version = "0.1.0"
description = "Agentic specification-drift auditor for pull requests"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "langgraph>=1.2.11",
    "langchain-anthropic>=1.7.2",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.4.1",
]

[project.scripts]
specwatch = "specwatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specwatch"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# tests/fixtures contains sample repos (including their own test_*.py files)
# used as input data by our tests -- they must never be collected as real
# SpecWatch tests.
testpaths = ["tests/unit", "tests/integration"]
