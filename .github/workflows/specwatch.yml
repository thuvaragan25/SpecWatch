name: SpecWatch

# Analyzes pull requests for specification drift. Requires docs/product-prd.md
# to exist (added in Phase 14 -- see plan.md's Dogfooding Requirement) and an
# ANTHROPIC_API_KEY repository secret for the Investigator's model calls.
#
# This file has not been run in a real GitHub Actions environment -- there is
# no CI runner available where it was authored. Syntax and step ordering
# match plan.md §24's described workflow; treat the first real run as the
# actual validation.

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install SpecWatch
        run: uv sync

      - name: Index repository state
        run: uv run specwatch index --spec docs/product-prd.md

      - name: Analyze base...head
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          uv run specwatch analyze
          --base origin/${{ github.event.pull_request.base.ref }}
          --head HEAD
          --post-github
